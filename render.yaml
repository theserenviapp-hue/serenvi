databases:
  - name: serenvi-db
    plan: free
    databaseName: serenvi_prod
    user: serenvi_prod_user

services:
  - type: web
    name: serenvi-backend
    plan: free
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: |
      cd backend
      echo "DATABASE_URL=$DATABASE_URL" > .env.production.local
      echo "NODE_ENV=production" >> .env.production.local
      npx prisma migrate deploy --skip-generate
      npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: serenvi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "7d"
      - key: FRONTEND_URL
        value: "https://serenvi.onrender.com"
        sync: false
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_HELMET
        value: "true"
      - key: ENABLE_CORS
        value: "true"
      - key: ENABLE_RATE_LIMITING
        value: "true"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
